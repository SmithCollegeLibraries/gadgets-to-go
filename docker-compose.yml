services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: gadgets_to_go
      MYSQL_USER: gadgets_to_go
      MYSQL_PASSWORD: gadgets_to_go
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  backend:
    image: yiisoftware/yii2-php:8.3-apache
    depends_on:
      - db
    environment:
      APP_ENV: dev
      YII_DEBUG: "false"
      APP_SECRET_KEY: change-me-local-development-secret-at-least-32-bytes
      APP_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://localhost:5173,https://127.0.0.1:5173
      FRONTEND_BASE_URL: http://localhost:5173
      DB_DSN: mysql:host=db;dbname=gadgets_to_go
      DB_USER: gadgets_to_go
      DB_PASSWORD: gadgets_to_go
      DB_CHARSET: utf8mb4
      AUTH_PROVIDERS: shibboleth,local
      FOLIO_USERNAME: ${FOLIO_USERNAME:-}
      FOLIO_PASSWORD: ${FOLIO_PASSWORD:-}
      FOLIO_API_KEY: ${FOLIO_API_KEY:-}
      FOLIO_TENANT_ID: ${FOLIO_TENANT_ID:-}
      FOLIO_AVAILABILITY_BASE_URL: ${FOLIO_AVAILABILITY_BASE_URL:-}
      FOLIO_INVENTORY_BASE_URL: ${FOLIO_INVENTORY_BASE_URL:-}
      FOLIO_BASE_URL: ${FOLIO_BASE_URL:-}
      FOLIO_OKAPI_URL: ${FOLIO_OKAPI_URL:-}
      FOLIO_RTAC_BASE_PATH: ${FOLIO_RTAC_BASE_PATH:-/prod/rtac/folioRTAC?mms_id=}
      LOCAL_ADMIN_USERNAME: admin
      LOCAL_ADMIN_PASSWORD: admin
      LOCAL_ADMIN_EMAIL: admin@example.edu
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@example.edu
      ACCESS_REQUEST_RECIPIENTS: admin@example.edu
    volumes:
      - ./backend:/app:delegated
    ports:
      - "8000:80"

  frontend:
    image: node:20-alpine
    depends_on:
      - backend
    working_dir: /app
    environment:
      VITE_BASE_URL: /
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_AUTH_URL: http://localhost:8000/admin/authorize.php
      VITE_ENABLE_SETUP_CONFIG: ${VITE_ENABLE_SETUP_CONFIG:-false}
    volumes:
      - ./:/app:delegated
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

volumes:
  db-data:
